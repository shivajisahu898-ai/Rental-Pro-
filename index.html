<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rental Pro - Dhuma Seoni - Final</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
.header{background:#1e3a8a;color:white;padding:15px;text-align:center}
.card{background:white;margin:10px;padding:15px;border-radius:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.btn{padding:10px 14px;border:none;border-radius:20px;color:white;font-weight:bold;margin:3px;cursor:pointer;font-size:13px}
.btn-green{background:#16a34a}.btn-blue{background:#2563eb}.btn-orange{background:#ea580c}.btn-red{background:#dc2626}.btn-what{background:#25D366}
.admin{background:#0f172a;color:white;padding:15px;margin-top:20px;min-height:400px}
</style>
</head>
<body>
<div class="header">
<h2>🚜 Rental Pro - Dhuma Seoni</h2>
<p>JCB, Tractor, Crane 24x7 Booking - Final Version</p>
</div>

<div id="vehicles"></div>

<div class="admin">
<h2>🔧 REAL ADMIN PANEL - Live</h2>
<p id="stats">Loading...</p>
<div id="bookings"><p>Bookings load ho rahi hai...</p></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDmZFNijGNPtl278ToBzdRzzt68K8W6Ru8",
  authDomain: "rental-pro-in.firebaseapp.com",
  databaseURL: "https://rental-pro-in-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rental-pro-in",
  storageBucket: "rental-pro-in.firebasestorage.app",
  messagingSenderId: "554127859621",
  appId: "1:554127859621:android:4ec5e68d15fc905d1f524c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const vehiclesData = [
  {name:"JCB 3DX EcoXpert - India No.1", rate:10500, img:"🚜"},
  {name:"Tractor with Trolley", rate:2500, img:"🚛"},
  {name:"Hydra Crane 15 Ton", rate:8000, img:"🏗️"},
  {name:"Poclain Excavator", rate:12000, img:"🚧"},
  {name:"Water Tanker", rate:2000, img:"🚚"},
  {name:"Road Roller", rate:6000, img:"🚜"}
];

function loadVehicles(){
  let html="";
  vehiclesData.forEach(v=>{
    html+=`<div class="card"><h3>${v.img} ${v.name}</h3><p><b>Rate: ₹${v.rate}/day</b></p>
    <button class="btn btn-green" onclick="bookNow('${v.name}','${v.rate}')">📅 Book Now</button>
    <button class="btn btn-blue" onclick="payUPI('${v.rate}')">💰 Advance Pay</button></div>`;
  });
  document.getElementById('vehicles').innerHTML=html;
}
function payUPI(rate){
  let upi="shivajisahu898@okicici";
  let amount=Math.round(rate*0.1);
  window.open(`upi://pay?pa=${upi}&pn=Rental Pro&am=${amount}&cu=INR&tn=Advance Booking`,"_blank");
}
function bookNow(vehicleName, rate){
  let name = prompt("Aapka Naam?");
  if(!name) return;
  let phone = prompt("WhatsApp Number (10 digit)?");
  if(!phone || phone.length<10) return alert("Sahi number dalo");
  if(!confirm("Location ON kare? Driver ko aapka location dikhega")) {
    let loc = prompt("Gaon ka naam likho?");
    saveBooking(vehicleName, rate, name, phone, loc, "", "");
    return;
  }
  navigator.geolocation.getCurrentPosition((pos)=>{
    let lat=pos.coords.latitude, lng=pos.coords.longitude;
    let loc = prompt("Gaon/Location ka naam?");
    saveBooking(vehicleName, rate, name, phone, loc||"GPS Location", lat, lng);
  }, ()=>{
    let loc = prompt("GPS Allow nahi hua, Gaon ka naam likho?");
    saveBooking(vehicleName, rate, name, phone, loc||"Manual", "", "");
  }, {enableHighAccuracy:true});
}
function saveBooking(vehicle, rate, cName, cPhone, loc, lat, lng){
  let id = Date.now().toString();
  db.ref("bookings/"+id).set({
    vehicle: vehicle, rate: rate, customerName: cName, customerPhone: cPhone,
    location: loc, custLat: lat, custLng: lng, driverLat: "", driverLng: "",
    status: "Pending", time: new Date().toLocaleString("en-IN", {timeZone:"Asia/Kolkata"}), id: id
  }).then(()=>{
    alert("✅ Booking Ho Gayi! Driver aapko call karega");
    let msg = `*Rental Pro* ✅ Booking Received%0A%0A${vehicle}%0AName: ${cName}%0ALoc: ${loc}%0AMap: https://www.google.com/maps?q=${lat},${lng}`;
    window.open(`https://wa.me/91${cPhone}?text=${msg}`, "_blank");
    setTimeout(()=>{
      let adminMsg = `*NEW BOOKING* 🔔%0A${vehicle}%0ACust: ${cName} ${cPhone}%0ALoc: ${loc}%0Ahttps://www.google.com/maps?q=${lat},${lng}`;
      window.open(`https://wa.me/919201900450?text=${adminMsg}`, "_blank");
    },1000);
  });
}
function loadBookings(){
  db.ref("bookings").on("value", snap=>{
    let data = snap.val();
    let count = data ? Object.keys(data).length : 0;
    document.getElementById('stats').innerText=`Vehicles: ${vehiclesData.length} | Bookings: ${count} | Firebase: Connected ✅`;
    let html="";
    if(!data){ document.getElementById('bookings').innerHTML="<p style='color:white'>Koi booking nahi</p>"; return; }
    Object.values(data).reverse().forEach(b=>{
      html+=`<div class="card" style="color:black">
      <b>${b.vehicle} - ₹${b.rate}</b><br>👤 ${b.customerName} (${b.customerPhone})<br>📍 ${b.location} • ${b.time}<br>
      Status: <b style="color:${b.status=='Pending'?'red':'green'}">${b.status}</b><br>
      ${b.custLat?`Cust GPS: ${parseFloat(b.custLat).toFixed(5)}, ${parseFloat(b.custLng).toFixed(5)}<br>`:''}
      ${b.driverLat?`Driver GPS: ${parseFloat(b.driverLat).toFixed(5)}, ${parseFloat(b.driverLng).toFixed(5)}<br>`:''}
      <br>
      <button class="btn btn-green" onclick="acceptBooking('${b.id}','${b.customerPhone}','${b.customerName}','${b.vehicle}')">✅ ACCEPT</button>
      ${b.custLat?`<button class="btn btn-orange" onclick="openMap(${b.custLat},${b.custLng})">📍 Customer Kahan Hai?</button>
      <a href="https://www.google.com/maps/dir/?api=1&destination=${b.custLat},${b.custLng}" target="_blank"><button class="btn btn-blue">🧭 Rasta Dekho</button></a>`: '<span style="color:red;font-size:12px">Customer ne GPS nahi diya</span>'}
      ${b.driverLat?`<button class="btn btn-blue" onclick="openMap(${b.driverLat},${b.driverLng})">🚜 Driver Track</button>`:''}
      <button class="btn btn-red" onclick="deleteBooking('${b.id}')">🗑️ DELETE</button>
      <button class="btn btn-what" onclick="waCustomer('${b.customerPhone}')">💬 WA</button>
      </div>`;
    });
    document.getElementById('bookings').innerHTML=html;
  });
}
function openMap(lat,lng){ window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`, "_blank"); }
function acceptBooking(id, phone, name, vehicle){
  navigator.geolocation.getCurrentPosition((pos)=>{
    let lat=pos.coords.latitude, lng=pos.coords.longitude;
    db.ref("bookings/"+id).update({status:"Accepted - On The Way", driverLat:lat, driverLng:lng, acceptedAt:new Date().toLocaleString("en-IN")})
    .then(()=>{
      alert("✅ Accepted + Location ON");
      let msg=`Hi ${name}, ${vehicle} ACCEPT ho gayi! Driver On The Way. Track: https://www.google.com/maps?q=${lat},${lng}`;
      window.open(`https://wa.me/91${phone}?text=${encodeURIComponent(msg)}`, "_blank");
    });
  }, e=>alert("Location Allow karo: "+e.message), {enableHighAccuracy:true});
}
function deleteBooking(id){ if(confirm("Delete?")) db.ref("bookings/"+id).remove(); }
function waCustomer(p){ window.open(`https://wa.me/91${p}?text=${encodeURIComponent("Hi, Rental Pro se bol raha hu...")}`, "_blank"); }
loadVehicles(); loadBookings();
</script>
</body>
</html>
